name: Bern – täglicher Metadatenmonitor
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
      timezone: 'Europe/Zurich'
permissions:
  contents: write
concurrency:
  group: i14y-bern-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: I14Y-Metadaten prüfen
        run: python monitor.py
      - name: opendata.swiss-Metadaten prüfen
        run: python opendata_monitor.py
      - name: Tagesstände und Webarchiv speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "Tägliche Metadatenstände aktualisieren"
            git push
          fi
